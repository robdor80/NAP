# NAP05 only: bounded synthetic tests; never enable NAP CI, production or CUTOVER.
name: NAP05 - recovery and operational diagnostics Windows x64
on:
  push:
    branches:
      - feature/nap05-recuperacion-robustez-20261113
  workflow_dispatch:
concurrency:
  group: nap05-recovery-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-nap05-recovery:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore .NET 10 solution
        run: dotnet restore NAP.sln --verbosity minimal
      - name: Build product Release and test binaries
        env:
          SIXLABORS_LICENSE_B64: ${{ secrets.SIXLABORS_LICENSE_B64 }}
        run: |
          ./.github/scripts/Invoke-LicensedDotnet.ps1 -DotnetArguments 'build','NAP.sln','-c','Release','--no-restore'
          if ($LASTEXITCODE -ne 0) { throw 'NAP05 Release build failed' }
      - name: Focused recovery, isolation, storage and IPC diagnostic tests (TEMP)
        run: |
          New-Item -ItemType Directory -Force artifacts/nap05 | Out-Null
          $filter = '(FullyQualifiedName~NAP.Tests.Nap05RecoveryTests|FullyQualifiedName~NAP.Tests.CatalogDiversityTests|FullyQualifiedName~NAP.Tests.ProfessionalUiTests|FullyQualifiedName~NAP.Tests.VisualExplorerWindowsSmokeTests|FullyQualifiedName~NAP.Tests.AutomationManagedWpfTests|FullyQualifiedName~NAP.Tests.AutomationHostControlTests|FullyQualifiedName~NAP.Tests.AutomationSuspensionTests|FullyQualifiedName~NAP.Tests.PreparationStorageDiagnosticsTests.OriginalStorageFailureIsReportedWithoutChangingIdentityOrAdoptingEffects|FullyQualifiedName~NAP.Tests.AssetExecutionCoordinatorTests.TwoUniversesWithSameAssetIdRemainPhysicallyIsolated|FullyQualifiedName~NAP.Tests.Nap03AssetFlowTests.NoGeminiAndNoSyntheticAuditCannotPublishAnAsset)&FullyQualifiedName!~GitRequiresRealSessionEvidenceAndIndependentCommitPushConfirmations'
          dotnet test tests/NAP.Tests/NAP.Tests.csproj -c Release --no-build --no-restore --blame-hang-timeout 90s --filter $filter --settings tests/functional.runsettings --results-directory artifacts/nap05 --logger 'trx;LogFileName=nap05-windows-x64.trx'
          if ($LASTEXITCODE -ne 0) { throw 'NAP05 focused tests failed' }
      - name: Remove private Six Labors material
        if: ${{ always() }}
        run: ./.github/scripts/Invoke-LicensedDotnet.ps1 -Cleanup
      - name: Preserve bounded evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nap05-recovery-${{ github.sha }}
          path: artifacts/nap05/
          if-no-files-found: warn
          retention-days: 30
