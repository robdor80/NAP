name: Phase 6 focused UI review

# Isolated branch only. Never invokes NAP.sln tests or ZIP/host volume fixtures.
on:
  push:
    branches: [codex/nap-2-fase-6-ux]
    paths:
      - 'src/**'
      - 'tests/NAP.Tests/Phase6OverviewTests.cs'
      - 'tests/NAP.Tests/AutomationQueueTests.cs'
      - 'tests/NAP.Tests/ProfessionalUiTests.cs'
      - '.github/workflows/phase6-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-review:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build WPF with the existing official license validation
        shell: pwsh
        env:
          SIXLABORS_LICENSE_B64: ${{ secrets.SIXLABORS_LICENSE_B64 }}
        run: ./.github/scripts/Invoke-LicensedDotnet.ps1 -DotnetArguments 'build','src/NAP.App/NAP.App.csproj','-c','Release'
      - name: Build the test assembly without executing any tests
        shell: pwsh
        env:
          SIXLABORS_LICENSE_B64: ${{ secrets.SIXLABORS_LICENSE_B64 }}
        run: ./.github/scripts/Invoke-LicensedDotnet.ps1 -DotnetArguments 'build','tests/NAP.Tests/NAP.Tests.csproj','-c','Release'
      - name: Only Phase 6 display and metadata tests plus navigation
        shell: pwsh
        run: |
          dotnet test tests/NAP.Tests/NAP.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~Phase6Overview|FullyQualifiedName~UnconfiguredNavigationNeverInventsCountsOrPerformsIo' --results-directory artifacts/phase6 --logger 'trx;LogFileName=phase6-focused.trx'
          if ($LASTEXITCODE -ne 0) { throw 'Focused tests failed.' }
      - name: Capture the actual WPF Home at two window sizes using only in-memory data
        shell: pwsh
        run: |
          $appPath = Join-Path $PWD 'src/NAP.App/bin/Release/net8.0-windows/NAP.App.exe'
          $captureRoot = Join-Path $PWD 'artifacts/phase6'
          foreach ($mode in @('active','paused','review','offline','local')) {
            $process = Start-Process $appPath -ArgumentList "--phase6-preview=$mode", "--phase6-output=$captureRoot" -PassThru
            if (-not $process.WaitForExit(60000)) { $process.Kill(); throw "Preview timed out: $mode" }
            if ($process.ExitCode -ne 0) { throw "Preview failed: $mode ($($process.ExitCode))" }
          }
          $process = Start-Process $appPath -ArgumentList '--phase6-preview=review', "--phase6-output=$captureRoot", '--compact' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Compact preview timed out.' }
          if ($process.ExitCode -ne 0) { throw 'Compact preview failed.' }
          if (@(Get-ChildItem $captureRoot -Filter '*.png').Count -ne 6) { throw 'Expected six native WPF captures.' }
          git rev-parse HEAD | Out-File (Join-Path $captureRoot 'source-sha.txt')
          Get-ChildItem $captureRoot -Filter '*.png' | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Out-File (Join-Path $captureRoot 'captures.sha256')
      - name: Clean temporary license before artifacts
        if: ${{ always() }}
        shell: pwsh
        run: ./.github/scripts/Invoke-LicensedDotnet.ps1 -Cleanup
      - name: Preserve focused results and synthetic captures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase6-review
          path: artifacts/phase6/
          if-no-files-found: warn
          retention-days: 14
