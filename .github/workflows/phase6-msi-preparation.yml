name: Phase 6 isolated acceptance package
on:
  workflow_dispatch:
  push:
    branches: [codex/nap-2-fase-6-ux]
    paths:
      - 'src/**'
      - 'tools/NAP.AcceptanceIoProbe/**'
      - 'tools/NAP.PrivatePackageProbe/**'
      - '.github/workflows/phase6-msi-preparation.yml'
      - '.github/scripts/Package-Phase6Acceptance.ps1'
      - '.github/scripts/Verify-DownloadedAcceptance.ps1'
      - 'docs/phase6-public-acceptance/notices/**'
      - 'docs/phase6-public-acceptance/package/**'
permissions:
  contents: write # Allowlisted synthetic evidence on this branch only; never binaries.
  actions: read
jobs:
  isolated-acceptance:
    if: github.ref == 'refs/heads/codex/nap-2-fase-6-ux'
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.426
      - name: Checkout unchanged pre-fix baseline for comparative WPF evidence
        uses: actions/checkout@v5
        with:
          ref: fe69ba3500845c3e0f63c9336f159d0a2cda3bee
          path: .ux-baseline
      - name: Build baseline with identical capture instrumentation only
        shell: pwsh
        env:
          SIXLABORS_LICENSE_B64: ${{ secrets.SIXLABORS_LICENSE_B64 }}
        run: |
          Copy-Item src/NAP.App/Phase6Acceptance.cs .ux-baseline/src/NAP.App/Phase6Acceptance.cs
          Copy-Item src/NAP.App/Phase6UxEvidence.cs .ux-baseline/src/NAP.App/Phase6UxEvidence.cs
          ./.github/scripts/Invoke-LicensedDotnet.ps1 -DotnetArguments 'publish','.ux-baseline/src/NAP.App/NAP.App.csproj','-c','Release','-r','win-x64','--self-contained','true','-p:Phase6AcceptanceOnly=true','-p:DebugType=None','-p:DebugSymbols=false','-o',"$env:RUNNER_TEMP/nap-ux-before"
          if ($LASTEXITCODE -ne 0) { throw 'Baseline build failed.' }
      - name: Capture actual baseline WPF before corrections
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'nap-ux-before/NAP.App.exe'
          $errorFile = Join-Path $env:RUNNER_TEMP 'baseline.stderr.txt'
          $p = Start-Process $app -ArgumentList '--phase6-self-test','--compact' -RedirectStandardError $errorFile -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Baseline capture timed out.' }
          if ($p.ExitCode -ne 0) { Get-Content $errorFile; throw 'Baseline capture failed.' }
          $target = 'artifacts/phase6-evidence'
          New-Item -ItemType Directory -Force $target | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP/nap-ux-before/laboratorio" -File | Where-Object Name -Like 'ux-*' | ForEach-Object { Copy-Item $_.FullName (Join-Path $target ('before-' + $_.Name)) }
          'fe69ba3; identical Phase6Acceptance.cs and Phase6UxEvidence.cs instrumentation; original views and themes' | Out-File "$target/before-source.txt"
          # Delete only the known second checkout inside this disposable runner workspace.
          $baseline = [IO.Path]::GetFullPath((Join-Path $PWD '.ux-baseline'))
          if ($baseline -ne [IO.Path]::GetFullPath("$env:GITHUB_WORKSPACE/.ux-baseline")) { throw 'Unexpected baseline path.' }
          Remove-Item -LiteralPath $baseline -Recurse -Force
      - name: Publish acceptance-only self-contained Windows x64
        shell: pwsh
        env:
          SIXLABORS_LICENSE_B64: ${{ secrets.SIXLABORS_LICENSE_B64 }}
        run: >-
          ./.github/scripts/Invoke-LicensedDotnet.ps1 -DotnetArguments
          'publish','src/NAP.App/NAP.App.csproj','-c','Release','-r','win-x64','--self-contained','true',
          '-p:Phase6AcceptanceOnly=true','-p:PublishSingleFile=false','-p:PublishTrimmed=false',
          '-p:DebugType=None','-p:DebugSymbols=false','-p:ContinuousIntegrationBuild=true',
          '-o',"$env:RUNNER_TEMP/nap-acceptance-publish"
      - name: Build memory runtime probe
        shell: pwsh
        env:
          SIXLABORS_LICENSE_B64: ${{ secrets.SIXLABORS_LICENSE_B64 }}
        run: ./.github/scripts/Invoke-LicensedDotnet.ps1 -DotnetArguments 'build','tools/NAP.PrivatePackageProbe/NAP.PrivatePackageProbe.csproj','-c','Release'
      - name: Build focused tests
        shell: pwsh
        env:
          SIXLABORS_LICENSE_B64: ${{ secrets.SIXLABORS_LICENSE_B64 }}
        run: ./.github/scripts/Invoke-LicensedDotnet.ps1 -DotnetArguments 'build','tests/NAP.Tests/NAP.Tests.csproj','-c','Release'
      - name: Remove private build license before runtime or packaging
        if: always()
        shell: pwsh
        run: ./.github/scripts/Invoke-LicensedDotnet.ps1 -Cleanup
      - name: Build runner-only file I/O observer
        shell: pwsh
        run: dotnet build tools/NAP.AcceptanceIoProbe/NAP.AcceptanceIoProbe.csproj -c Release
      - name: Verify, extract, exercise and package the exact published bytes
        shell: pwsh
        run: ./.github/scripts/Package-Phase6Acceptance.ps1
      - name: Upload verified application files as one directly extractable ZIP
        id: package
        uses: actions/upload-artifact@v4
        with:
          name: NAP-2.0-Fase6-UX-Corregida-Windows-x64
          path: ${{ runner.temp }}/nap-acceptance-publish/
          if-no-files-found: error
          retention-days: 90
      - name: Download published artifact again and verify every byte
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NAP_ARTIFACT_ID: ${{ steps.package.outputs.artifact-id }}
          NAP_ARTIFACT_DIGEST: ${{ steps.package.outputs.artifact-digest }}
          NAP_ARTIFACT_URL: ${{ steps.package.outputs.artifact-url }}
        run: ./.github/scripts/Verify-DownloadedAcceptance.ps1
      - name: Preserve logs, screenshots, tests and isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NAP-Fase6-evidencias-${{ github.sha }}
          path: artifacts/phase6-evidence/
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve only synthetic evidence on the authorized branch
        if: always()
        shell: pwsh
        run: |
          $path = "docs/phase6-public-acceptance/runs/$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force $path | Out-Null
          if (Test-Path artifacts/phase6-evidence) {
            foreach ($file in @(Get-ChildItem artifacts/phase6-evidence -File)) {
              if ($file.Extension -notin @('.json','.txt','.trx','.png','.sha256')) { throw 'Unexpected evidence type.' }
              Copy-Item $file.FullName $path
            }
          }
          git rev-parse HEAD | Out-File "$path/source-sha.txt"
          git add -- $path
          git -c user.name='NAP evidence bot' -c user.email='nap-evidence@users.noreply.github.com' commit -m 'docs(phase6): preserve isolated acceptance verification evidence [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'Evidence commit failed.' }
          git push origin HEAD:refs/heads/codex/nap-2-fase-6-ux
          if ($LASTEXITCODE -ne 0) { throw 'Evidence push failed.' }
      - name: Ensure license cleanup
        if: always()
        shell: pwsh
        run: ./.github/scripts/Invoke-LicensedDotnet.ps1 -Cleanup
