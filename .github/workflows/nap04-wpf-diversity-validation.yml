# NAP04 only. Never enable the historical general NAP CI.
name: NAP04 - RobStyle and catalog diversity Windows x64
on:
  push:
    branches:
      - feature/nap04-robstyle-diversidad-lab-20261113
  workflow_dispatch:
concurrency:
  group: nap04-visual-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  wpf-review:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore solution
        run: dotnet restore NAP.sln --verbosity minimal
      - name: Compile WPF, Core, AI and AutomationHost
        env:
          SIXLABORS_LICENSE_B64: ${{ secrets.SIXLABORS_LICENSE_B64 }}
        run: |
          ./.github/scripts/Invoke-LicensedDotnet.ps1 -DotnetArguments 'build','NAP.sln','-c','Release','--no-restore'
          if ($LASTEXITCODE -ne 0) { throw 'NAP04 Release build failed' }
      - name: Focused diversity, visual, host and NAP03 regression tests
        run: |
          New-Item -ItemType Directory -Force artifacts/nap04 | Out-Null
          # Existing F7 Git owner-only ACL scenarios fail on hosted elevated Windows (not a NAP04 change).
          # Keep the protected storage contract intact; rerun these two scenarios locally in a non-elevated MSI session.
          $filter = '(FullyQualifiedName~CatalogDiversityTests|FullyQualifiedName~ProfessionalUiTests|FullyQualifiedName~AutomationManagedWpfTests|FullyQualifiedName~AutomationWpfTests|FullyQualifiedName~VisualExplorerWindowsSmokeTests|FullyQualifiedName~Nap03AssetFlowTests|FullyQualifiedName~CatalogExplorerTests|FullyQualifiedName~LegacyPortraitIndexTests)&FullyQualifiedName!~GitRequiresRealSessionEvidenceAndIndependentCommitPushConfirmations'
          dotnet test tests/NAP.Tests/NAP.Tests.csproj -c Release --no-build --no-restore --blame-hang-timeout 120s --filter $filter --settings tests/functional.runsettings --results-directory artifacts/nap04 --logger 'trx;LogFileName=nap04-windows-x64.trx'
          if ($LASTEXITCODE -ne 0) { throw 'NAP04 focused regressions failed' }
      - name: Remove temporary Six Labors license material
        if: ${{ always() }}
        run: ./.github/scripts/Invoke-LicensedDotnet.ps1 -Cleanup
      - name: Archive technical results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nap04-wpf-${{ github.sha }}
          path: artifacts/nap04/
          if-no-files-found: warn
          retention-days: 30
