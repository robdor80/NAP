name: NAP09 - IPC entre identidades Windows (laboratorio)

on:
  push:
    branches:
      - feature/nap09-preflight-retratos-treskal-20261114
    paths:
      - src/NAP.Core/AutomationProtocol.cs
      - src/NAP.Core/AutomationWindowsEndpointAccess.cs
      - tests/NAP.Tests/Nap09ProtectedIpcTests.cs
      - .github/workflows/nap09-protected-ipc-windows.yml
  pull_request:
    paths:
      - src/NAP.Core/AutomationProtocol.cs
      - src/NAP.Core/AutomationWindowsEndpointAccess.cs
      - tests/NAP.Tests/Nap09ProtectedIpcTests.cs
      - .github/workflows/nap09-protected-ipc-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nap09-ipc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-protected-transport:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore .NET 10
        run: dotnet restore NAP.sln --verbosity minimal
      - name: Build NAP with private Six Labors license
        env:
          SIXLABORS_LICENSE_B64: ${{ secrets.SIXLABORS_LICENSE_B64 }}
        run: |
          ./.github/scripts/Invoke-LicensedDotnet.ps1 -DotnetArguments 'build','NAP.sln','-c','Release','--no-restore'
          if ($LASTEXITCODE -ne 0) { throw 'NAP09 Release build failed' }
      - name: Focused Windows IPC and Host compatibility tests (TEMP only)
        run: |
          New-Item -ItemType Directory -Force artifacts/nap09 | Out-Null
          $filter = 'FullyQualifiedName~NAP.Tests.Nap09ProtectedIpcTests|FullyQualifiedName~NAP.Tests.AutomationProtocolTests|FullyQualifiedName~NAP.Tests.AutomationHostTests'
          dotnet test tests/NAP.Tests/NAP.Tests.csproj -c Release --no-build --no-restore --filter $filter --settings tests/functional.runsettings --results-directory artifacts/nap09 --logger 'trx;LogFileName=nap09-ipc-windows.trx' --blame-hang-timeout 120s
          if ($LASTEXITCODE -ne 0) { throw 'NAP09 IPC tests failed' }
      - name: Clean private license material
        if: ${{ always() }}
        run: ./.github/scripts/Invoke-LicensedDotnet.ps1 -Cleanup
      - name: Preserve targeted tests
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nap09-ipc-${{ github.sha }}
          path: artifacts/nap09/
          if-no-files-found: warn
          retention-days: 14
