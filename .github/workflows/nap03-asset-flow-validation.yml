# NAP03 isolated: no NAP CI, no production paths, no real Gemini transport.
name: NAP03 - mixed-universe asset processing Windows x64
on:
  push:
    branches:
      - feature/nap03-asset-flow-20261113
  workflow_dispatch:
concurrency:
  group: nap03-assets-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-asset-flow:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore solution
        run: dotnet restore NAP.sln --verbosity minimal
      - name: Build real WPF, Core, AI and Host
        env:
          SIXLABORS_LICENSE_B64: ${{ secrets.SIXLABORS_LICENSE_B64 }}
        run: |
          ./.github/scripts/Invoke-LicensedDotnet.ps1 -DotnetArguments 'build','NAP.sln','-c','Release','--no-restore'
          if ($LASTEXITCODE -ne 0) { throw 'NAP03 Release compilation failed' }
          foreach ($name in @('NAP.AutomationHost.dll','NAP.AI.dll','NAP.AutomationHost.deps.json')) {
            if (-not (Test-Path ('src/NAP.App/bin/Release/net10.0-windows/' + $name))) { throw ('Missing WPF-host dependency: ' + $name) }
          }
      - name: Focused pipeline, legacy, recovery and UI tests only
        run: |
          New-Item -ItemType Directory -Force artifacts/nap03 | Out-Null
          $filter = 'FullyQualifiedName~Nap03AssetFlowTests|FullyQualifiedName~AutomationHostTests|FullyQualifiedName~DurableExecutionTests|FullyQualifiedName~AutomationManagedWpfTests|FullyQualifiedName~RemoteNormalizationKeepsPreviewAndDecisionBoundToServerProposal|FullyQualifiedName~RemoteManualPipelineKeepsNativeAuthorityInHostAndPreservesBackupFunctions|FullyQualifiedName~RequestReplayDoesNotCreateSecondManualJobAndCrossUniverseReferenceIsRejected|FullyQualifiedName~AutomationProtocolTests|FullyQualifiedName~AutomationWpfTests|FullyQualifiedName~GeminiOperationAuditClientTests|FullyQualifiedName~LegacyPortraitIndexTests|FullyQualifiedName~LegacyMasterEvidenceIndexTests'
          dotnet test tests/NAP.Tests/NAP.Tests.csproj -c Release --no-build --no-restore --blame-hang-timeout 120s --filter $filter --settings tests/functional.runsettings --results-directory artifacts/nap03 --logger 'trx;LogFileName=nap03-windows-x64.trx'
          if ($LASTEXITCODE -ne 0) { throw 'NAP03 focused tests failed' }
      - name: Clean private license material
        if: ${{ always() }}
        run: ./.github/scripts/Invoke-LicensedDotnet.ps1 -Cleanup
      - name: Preserve test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nap03-asset-flow-${{ github.sha }}
          path: artifacts/nap03/
          if-no-files-found: warn
          retention-days: 30
